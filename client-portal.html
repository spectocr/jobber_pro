<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal</title>
    <link rel="icon" type="image/x-icon" id="favicon-link">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #667eea;
            font-size: 1.5rem;
        }

        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #c53030;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .empty-state {
            text-align: center;
            color: #718096;
            padding: 2rem;
        }

        .quote-card, .job-card {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
        }

        .quote-card h3, .job-card h3 {
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-sent {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-approved {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-scheduled {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-completed {
            background: #c6f6d5;
            color: #22543d;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 0.5rem;
            display: inline-block;
            text-decoration: none;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .message-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-form textarea {
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
        }

        .message-form button {
            align-self: flex-start;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 id="portalTitle">Client Portal</h1>
                <p id="clientName" style="color: #718096; margin-top: 0.25rem;"></p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="grid">
            <!-- Quotes Section -->
            <div class="card">
                <h2>📋 My Quotes</h2>
                <div id="quotesList"></div>
            </div>

            <!-- Jobs Section -->
            <div class="card">
                <h2>🔨 My Jobs</h2>
                <div id="jobsList"></div>
            </div>
        </div>

        <!-- Message Section -->
        <div class="card">
            <h2>💬 Send Message</h2>
            <form class="message-form" onsubmit="sendMessage(event)">
                <textarea id="messageText" placeholder="Ask a question or send a message..." rows="4" required></textarea>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        let clientData = null;

        async function loadClientData() {
            try {
                const response = await fetch('/api/client-portal/me');
                if (!response.ok) {
                    window.location.href = '/client-login';
                    return;
                }

                clientData = await response.json();
                document.getElementById('clientName').textContent = `Welcome, ${clientData.client.name}`;

                // Update branding
                if (clientData.settings.appName) {
                    document.getElementById('portalTitle').textContent = clientData.settings.appName + ' Portal';
                    document.title = clientData.settings.appName + ' - Client Portal';
                }
                if (clientData.settings.favicon) {
                    document.getElementById('favicon-link').href = clientData.settings.favicon;
                }

                renderQuotes(clientData.quotes);
                renderJobs(clientData.jobs);
            } catch (error) {
                console.error('Failed to load client data:', error);
                window.location.href = '/client-login';
            }
        }

        function renderQuotes(quotes) {
            const container = document.getElementById('quotesList');

            if (!quotes || quotes.length === 0) {
                container.innerHTML = '<div class="empty-state">No quotes yet</div>';
                return;
            }

            container.innerHTML = quotes.map(quote => {
                const statusClass = quote.status === 'approved' ? 'status-approved' :
                                   quote.status === 'sent' ? 'status-sent' : 'status-scheduled';

                const validUntil = new Date(quote.validUntil);
                const isExpired = validUntil < new Date() && quote.status === 'sent';

                return `
                    <div class="quote-card">
                        <h3>${quote.title}</h3>
                        <p><strong>Quote #:</strong> ${quote.quoteNumber}</p>
                        <p><strong>Total:</strong> $${parseFloat(quote.total || 0).toFixed(2)}</p>
                        <p><strong>Valid Until:</strong> ${validUntil.toLocaleDateString()}</p>
                        <p><span class="status-badge ${statusClass}">${quote.status.toUpperCase()}</span></p>
                        ${!isExpired ? `<a href="/quote-view/${quote.secureToken}" target="_blank" class="btn btn-primary">View Quote</a>` : '<p style="color: #e53e3e;">Expired</p>'}
                    </div>
                `;
            }).join('');
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobsList');

            if (!jobs || jobs.length === 0) {
                container.innerHTML = '<div class="empty-state">No jobs yet</div>';
                return;
            }

            container.innerHTML = jobs.map(job => {
                const statusClass = job.status === 'completed' ? 'status-completed' : 'status-scheduled';
                const date = job.scheduledDate ? new Date(job.scheduledDate).toLocaleDateString() : 'TBD';

                return `
                    <div class="job-card">
                        <h3>${job.title}</h3>
                        <p><strong>Date:</strong> ${date} ${job.scheduledTime || ''}</p>
                        <p><strong>Status:</strong> <span class="status-badge ${statusClass}">${job.status.replace('_', ' ').toUpperCase()}</span></p>
                        ${job.status === 'invoiced' ? `
                            <p><strong>Total:</strong> $${parseFloat(job.total || 0).toFixed(2)}</p>
                            <a href="/invoice/${job.id}" target="_blank" class="btn btn-primary">View Invoice</a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function sendMessage(event) {
            event.preventDefault();

            const message = document.getElementById('messageText').value;

            try {
                const response = await fetch('/api/client-portal/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (response.ok) {
                    alert('✅ Message sent! We\'ll get back to you soon.');
                    document.getElementById('messageText').value = '';
                } else {
                    alert('❌ Failed to send message. Please try again.');
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function logout() {
            try {
                await fetch('/api/client-portal/logout', { method: 'POST' });
                window.location.href = '/client-login';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/client-login';
            }
        }

        // Load data on page load
        loadClientData();
    </script>
</body>
</html>
